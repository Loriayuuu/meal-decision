      '牛肉蔬菜卷': {categories:['面食主食','肉类菜品'], flavors:['清爽少负担','家常咸香']}, '三鲜汤面': {categories:['汤面米线'], flavors:['清淡鲜香']},
      '砂锅土豆粉': {categories:['汤面米线','面食主食'], flavors:['家常咸香']}, '铁板鸡排饭': {categories:['米饭盖饭','肉类菜品'], flavors:['家常咸香']},
      '蔬菜豆腐便当': {categories:['蔬菜豆腐'], flavors:['清爽少负担','清淡鲜香']}, '酸菜肉丝面': {categories:['面食主食'], flavors:['酸辣开胃']},
      '番茄鸡蛋面': {categories:['汤面米线'], flavors:['清淡鲜香']}, '红油抄手面': {categories:['汤面米线','面食主食'], flavors:['酸辣开胃']},
      '牛肉汤粉': {categories:['汤面米线'], flavors:['清淡鲜香']}, '鸡丝凉面': {categories:['面食主食'], flavors:['清爽少负担']},
      '麻酱拌面': {categories:['面食主食'], flavors:['家常咸香']}, '酸辣粉': {categories:['汤面米线'], flavors:['酸辣开胃']},
      '西兰花菌菇饭': {categories:['蔬菜豆腐'], flavors:['清淡鲜香','清爽少负担']}, '家常豆腐饭': {categories:['蔬菜豆腐'], flavors:['家常咸香']},
      '玉米蔬菜煲': {categories:['蔬菜豆腐'], flavors:['清淡鲜香','清爽少负担']}, '菌菇杂粮焖饭': {categories:['蔬菜豆腐'], flavors:['清爽少负担','家常咸香']},
      '清汤鸡丝面': {categories:['汤面米线'], flavors:['清淡鲜香']}, '凉拌豆腐蔬菜盒': {categories:['蔬菜豆腐'], flavors:['清爽少负担','清淡鲜香']}
    };
    const $ = id => document.getElementById(id);
    let options = baseDishes.slice(0,8).map(d => d.name);
    function render(){
      const health = $('health').value, place = $('place').value, portion = $('portion').value, time = $('time').value, budget = $('budget').value, balance = $('balance').value;
      const flavor = $('flavor').value, category = $('category').value, avoid = $('avoid').value;
      const forbidden = avoid === '不吃香菜' ? ['香菜'] : avoid === '不吃辣' ? ['酸辣','酸汤','青椒','黑椒'] : avoid === '不吃海鲜' ? ['虾','鱼','三鲜'] : avoid === '不吃牛肉' ? ['牛肉','肥牛'] : avoid === '不吃猪肉' ? ['猪肉','卤肉','肉饼'] : [];
      const wanted = [];
      if(flavor === '酸辣开胃') wanted.push('酸辣','酸汤');
      if(flavor === '清淡鲜香') wanted.push('清淡','鲜','少油');
      if(flavor === '家常咸香') wanted.push('家常','平价');
      if(flavor === '酱香浓郁') wanted.push('酱香','照烧','卤肉');
      if(flavor === '清爽少负担') wanted.push('清淡','少油','减脂控卡');
      if(category === '汤面米线' || category === '面食主食') wanted.push('面','意面','米线','粉');
      if(category === '米饭盖饭') wanted.push('盖饭','饭');
      if(category === '蔬菜豆腐') wanted.push('全素','豆腐','蔬菜');
      if(category === '肉类菜品') wanted.push('高蛋白','肉','鸡','牛');
      if(health.includes('减脂')) wanted.push('减脂控卡','少油','高蛋白');
      if(health.includes('养胃')) wanted.push('养胃','清淡');
      if(health.includes('高蛋白')) wanted.push('高蛋白');
      if(health.includes('少辣少油')) wanted.push('少油','清淡');
      if(balance === '全素') wanted.push('全素');
      if(balance === '主食优先' || balance === '重碳水') wanted.push('主食优先','重碳水');
      if(balance === '多菜少饭' || balance === '荤素均衡') wanted.push(balance);
      if(portion.includes('小份')) wanted.push('一人食');
      if(portion.includes('大份')) wanted.push('标准份','分量足');
      if(budget.includes('15元以内')) wanted.push('15元以内','平价');
      if(budget.includes('15-25')) wanted.push('15-25元','平价');
      if(budget.includes('25-40')) wanted.push('25-40元');
      if(place.includes('外卖')) wanted.push('外卖友好');
      if(place.includes('到店')) wanted.push('到店合适');
      if(time.includes('快速')) wanted.push('出餐快','快速出餐');
      let dishes = baseDishes.filter(d => !forbidden.some(word => d.name.includes(word) || d.desc.includes(word)));
        if(category !== '想尝试不同品类') {
          dishes = dishes.filter(d => dishMeta[d.name].categories.includes(category));
        }
      if(balance === '全素') dishes = dishes.filter(d => d.tags.includes('全素') || d.name.includes('豆腐') || d.name.includes('蔬菜'));
      dishes = dishes.map((dish, index) => {
        const meta = dishMeta[dish.name];
        const categoryScore = category === '想尝试不同品类' ? 0 : meta.categories.includes(category) ? 24 : 0;
        const flavorScore = flavor === '口味随心' ? 0 : meta.flavors.includes(flavor) ? 18 : 0;
        const keywordScore = wanted.reduce((score, word) => score + (dish.name.includes(word) || dish.desc.includes(word) || dish.tags.some(tag => tag.includes(word)) ? 2 : 0), 0);
        return {dish, score: categoryScore + flavorScore + keywordScore - index * 0.01};
      }).sort((a,b) => b.score - a.score).map(item => item.dish);
      if(dishes.length < 8 && category === '想尝试不同品类') dishes = [...dishes, ...baseDishes.filter(d => !dishes.includes(d) && !forbidden.some(word => d.name.includes(word)))];
      dishes = dishes.slice(0,8);
      options = dishes.map(d => d.name);
      $('dishList').innerHTML = dishes.slice(0,8).map(d => `<article class="dish"><h3>${d.name}</h3><p>${d.desc}</p><div class="tags">${d.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></article>`).join('');
      $('wheel').innerHTML = options.map((o,i) => `<span class="wheel-label">${o}</span>`).join('');
      const pace = time.includes('快速') ? '快手' : '不赶时间';
      $('summaryTitle').textContent = `${pace}模式 · ${health.includes('普通') ? '今天吃点满足的' : health.replace('管理','')} `;
      $('summaryText').textContent = `${place.includes('外卖') ? '外卖配送' : '附近到店'}，${portion.split(' / ')[0]}，${budget}，${balance}，已筛掉不适配选项。`;
      const merchantTypes = place.includes('外卖') ? [['连锁盖饭店','真功夫·同类店','15-25元｜打包稳，约30分钟内'],['轻食便当店','轻食研究所·同类店','25-40元｜可选低脂，高蛋白'],['地方小炒店','家常小炒·同类店','15-25元｜标准份，配送友好']] : [['社区快餐店','附近家常菜·同类店','15-25元｜现做现吃，一人食'],['商场简餐店','商场简餐·同类店','25-40元｜座位舒适，适合午休'],['面饭小馆','街坊面饭馆·同类店','15元以内｜出餐快，分量足']];
      $('merchantList').innerHTML = merchantTypes.map(m => `<div class="merchant"><strong>${m[0]} · ${m[1]}</strong><span>${m[2]}</span></div>`).join('');
      $('winner').textContent = '';
    }
    $('run').addEventListener('click', render);
    $('spin').addEventListener('click', () => { const wheel=$('wheel'), spin=$('spin'); spin.disabled=true; $('winner').textContent='正在替你拍板...'; const index=Math.floor(Math.random()*options.length); wheel.style.transform=`rotate(${1440 + index*45 + Math.floor(Math.random()*30)}deg)`; setTimeout(()=>{ $('winner').textContent=`今天就吃：${options[index]}`; spin.disabled=false; },4300); });
    render();
  </script>
</body>
</html>
